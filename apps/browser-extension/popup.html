<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .badge-online { background: #065f46; color: #34d399; }
    .badge-offline { background: #7f1d1d; color: #f87171; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .toggle-row input {
      cursor: pointer;
    }
    .action-btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .action-btn:hover {
      background: #0369a1;
    }
    .url-input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>⚡ FDM</span>
    </div>
    <div id="statusBadge" class="badge badge-offline">Checking...</div>
  </div>

  <div class="toggle-row">
    <span>Download Interception</span>
    <input type="checkbox" id="interceptToggle" checked>
  </div>

  <div class="toggle-row">
    <span>Video Sniffer Bar</span>
    <input type="checkbox" id="snifferToggle" checked>
  </div>

  <div style="margin-top: 14px; border-top: 1px solid #1e293b; padding-top: 10px;">
    <input type="text" id="manualUrl" class="url-input" placeholder="Paste URL to download...">
    <button id="sendUrlBtn" class="action-btn">Send to FDM</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
